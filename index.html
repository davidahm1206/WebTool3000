<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebTool3000</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="app">
      <header>
        <h1>WebTool3000</h1>
        <p>Paste your rich text here (Ctrl+V) to get clean HTML</p>
      </header>
      <main>
        <div class="split-pane">
          <div class="input-pane">
            <div id="paste-area" contenteditable="true" data-placeholder="Paste (Ctrl+V) from Word or any website here..."></div>
          </div>
          <div class="output-pane">
            <div class="output-header">
              <h2>Generated HTML</h2>
              <div class="controls">
                <div class="checkbox-group">
                  <label class="checkbox-label" title="Keep formatting like bold, italic, underline, superscript, and links">
                    <input type="checkbox" id="keep-formatting" checked>
                    Keep Formatting
                  </label>
                  <label class="checkbox-label" title="Force first row into a <thead> block">
                    <input type="checkbox" id="use-thead">
                    First Row as Header
                  </label>
                  <label class="checkbox-label" title="Wrap text in <span> instead of <p>">
                    <input type="checkbox" id="use-span">
                    Use &lt;span&gt; for text
                  </label>
                </div>
                <div class="advanced-inputs">
                  <input type="text" id="table-class" placeholder="e.g. table table-dark" title="Table Classes">
                  <input type="text" id="table-style" placeholder="e.g. width: 100%;" title="Table Inline Styles">
                  <input type="text" id="td-class" placeholder="e.g. text-center" title="Cell (td/th) Classes">
                  <input type="text" id="td-style" placeholder="e.g. padding: 10px;" title="Cell (td/th) Inline Styles">
                  <input type="text" id="text-class" placeholder="e.g. text-muted" title="Text (p/span) Classes">
                  <input type="text" id="text-style" placeholder="e.g. margin-bottom: 5px;" title="Text (p/span) Inline Styles">
                  
                  <div style="flex-basis: 100%; display: flex; gap: 0.5rem; justify-content: flex-end; margin-top: 0.25rem;">
                    <button id="extract-btn" class="secondary-btn" title="Extract table styles from clipboard">Import Styles</button>
                    <button id="clear-btn" class="secondary-btn" title="Clear all classes and styles">Clear</button>
                  </div>
                </div>
                <button id="copy-btn">Copy Output</button>
              </div>
            </div>
            <textarea id="html-output" readonly placeholder="Your clean HTML will appear here..."></textarea>
          </div>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
